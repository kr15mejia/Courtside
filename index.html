<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courtside Stat Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#eaeff5;--card:#fff;--ink:#14213d;--mut:#66738a;--line:#d5dce6;--acc:#14213d;--onacc:#fff;--gold:#f4b400;--good:#1f8a4c;--bad:#c93a3a;--sel:#e3ecff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#18233a;--ink:#eef2f9;--mut:#8f9db5;--line:#2a3a58;--acc:#f4b400;--onacc:#14213d;--good:#4cc27f;--bad:#ff7a7a;--sel:#223457}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#18233a;--ink:#eef2f9;--mut:#8f9db5;--line:#2a3a58;--acc:#f4b400;--onacc:#14213d;--good:#4cc27f;--bad:#ff7a7a;--sel:#223457}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,system-ui,-apple-system,Segoe UI,sans-serif;max-width:560px;margin:0 auto;padding:0 12px 40px}
.num,h1,.score b{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif}
.board{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--acc);color:var(--onacc);border-radius:0 0 16px 16px;padding:10px 14px 12px;margin:0 -12px 12px}
.score{display:flex;justify-content:space-around;align-items:center;text-align:center}
.score b{display:block;font-size:56px;line-height:1;font-weight:700}
.score span{font-size:13px;opacity:.8}
.score span{display:block;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score i{font-style:normal;font-size:12px;opacity:.7}
.qs{display:flex;gap:6px;justify-content:center;margin-top:6px}
.qs button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:20px;padding:3px 12px;font:600 14px Barlow,sans-serif;opacity:.7}
.qs button.on{background:var(--onacc);color:var(--acc);opacity:1;border-color:var(--onacc)}
.tabs{display:flex;gap:4px;background:var(--card);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:transparent;color:var(--mut);border-radius:9px;padding:9px;font:600 15px Barlow,sans-serif}
.tabs button.on{background:var(--acc);color:var(--onacc)}
h1{font-size:20px;margin:14px 0 8px;font-weight:700}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pl{background:var(--card);border:2px solid transparent;border-radius:12px;padding:8px;text-align:left;color:var(--ink);font:inherit}
.pl.on{border-color:var(--acc);background:var(--sel)}
.pl .num{font-size:26px;font-weight:700;line-height:1}
.pl small{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl em{font-style:normal;font-size:13px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.grid.g4{grid-template-columns:1fr 1fr 1fr 52px}
.st{border:0;border-radius:12px;padding:16px 4px;font:700 20px "Barlow Condensed",sans-serif;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.st:active{transform:scale(.97)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--sel);color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;overflow:hidden;flex:none;vertical-align:middle}
.av img{width:100%;height:100%;object-fit:cover}
.avb{border:0;background:transparent;padding:0;margin-right:10px;border-radius:50%;line-height:0}
.rl>span{flex:1;min-width:0}
.rl>button:not(.avb){padding:6px 8px;color:var(--mut)}
.rl>button[data-rm],.rl>button[data-pdel]{color:var(--bad)}
.pl:disabled{opacity:.45}
.avp{background:var(--card);border-radius:12px;padding:10px;margin:-2px 0 8px}
.emo,.cols{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.emo button{font-size:24px;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;padding:0}
.cols button{width:34px;height:34px;border-radius:50%;border:2px solid var(--card);padding:0}
.emo button.sel,.cols button.sel{outline:3px solid var(--gold);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;font:600 14px Barlow,sans-serif}
.chips button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.row select{flex:1;border-radius:10px;border:1px solid var(--line);padding:11px;font:600 15px Barlow,sans-serif;background:var(--card);color:var(--ink);min-width:0}
.players.cg{grid-template-columns:repeat(5,1fr);gap:6px}
.pl.c{padding:6px 2px;text-align:center}
.pl.c small{font-size:11px}
.pl.c em{display:block;font-size:12px}
.sm{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 16px;font:600 14px Barlow,sans-serif}
.st:disabled{opacity:.4}
.grid.gs{grid-template-columns:1fr 40px 1fr 40px}
.st.u{font:600 14px Barlow,sans-serif;padding:0;color:var(--mut)}
.st.m{background:var(--good);color:#fff;box-shadow:none}
.st.x{background:var(--bad);color:#fff;box-shadow:none}
.st.o{background:var(--card);color:var(--ink)}
.line{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.line .num{font-size:20px;font-weight:700}
.line span{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;margin-top:10px}
.row button,.row input{flex:1;border-radius:10px;border:1px solid var(--line);padding:11px;font:600 15px Barlow,sans-serif;background:var(--card);color:var(--ink);min-width:0}
.row button.p{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.row button.d{color:var(--bad)}
.row input.n{flex:0 0 70px}
.empty{background:var(--card);border-radius:12px;padding:18px;color:var(--mut);text-align:center}
.wrap{overflow-x:auto;background:var(--card);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th,td{padding:8px 7px;text-align:right}
th{color:var(--mut);font-weight:600;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
tr.t td{font-weight:700;border-top:1px solid var(--line)}
.rl{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:12px;padding:8px 12px;margin-bottom:6px}
.rl button{border:0;background:transparent;color:var(--bad);font:600 14px Barlow,sans-serif;padding:6px}
#last{color:var(--mut);font-size:14px;min-height:20px;margin:10px 2px 0}
.hero{position:relative;overflow:hidden;background:#c9561a;color:#fff;border-radius:0 0 18px 18px;margin:0 -12px 14px;padding:34px 18px 30px;min-height:190px;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.hero .ball{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero .ht{position:relative;z-index:1}
.big{display:block;width:100%;margin-top:8px;padding:16px 18px;border-radius:14px;border:0;font:700 24px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;background:var(--card);color:var(--ink);text-align:left;box-shadow:inset 0 0 0 1px var(--line)}
.big.p{background:var(--acc);color:var(--onacc);box-shadow:none}
.big small{display:block;margin-top:4px;font:500 14px Barlow,system-ui,sans-serif;opacity:.75}
.qs button.hm{margin-right:10px}
#file,#cam{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.lbtn{flex:1;display:block;text-align:center;border-radius:10px;border:1px solid var(--line);padding:11px;font:600 15px Barlow,sans-serif;background:var(--card);color:var(--ink);cursor:pointer}
label.avb{display:inline-block;cursor:pointer}
.nm{border:0;background:transparent;color:inherit;font:inherit;padding:0;text-align:left;display:inline-flex;align-items:center;gap:4px;text-decoration:underline dotted;text-underline-offset:3px}
.seg{display:flex;gap:4px}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:600 14px Barlow,sans-serif}
.seg button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.seg button[data-res=m].on{background:var(--good);border-color:var(--good);color:#fff}
.seg button[data-res=x].on{background:var(--bad);border-color:var(--bad);color:#fff}
#csp{flex:1;border-radius:10px;border:1px solid var(--line);padding:8px;font:600 14px Barlow,sans-serif;background:var(--card);color:var(--ink);min-width:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tile{background:var(--card);border-radius:12px;padding:10px 6px;text-align:center}
.tile b{display:block;font:700 28px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.tile span{font-size:12px;color:var(--mut)}
.big.hof{background:linear-gradient(135deg,var(--t2l,#f6d36b),var(--t2,#c9921f));color:var(--t2ink,#2a1b13);box-shadow:none}
.hofchips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 6px;margin:0 -2px}
.hofchips button{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:22px;padding:5px 12px 5px 6px;font:600 14px Barlow,sans-serif}
.hofchips button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.tcard{perspective:1400px;width:min(100%,340px);height:492px;margin:12px auto 8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tin{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.tcard.flip .tin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;padding:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 10px 28px rgba(0,0,0,.35);background:linear-gradient(135deg,var(--t2l,#f6d36b),var(--t2,#b8862b) 38%,var(--t2l,#f8e594) 55%,var(--t2d,#9a6a1c))}
.face.back{transform:rotateY(180deg)}
.face .fi{position:relative;height:100%;border-radius:11px;overflow:hidden;display:flex;flex-direction:column;text-shadow:none}
.front .fi{background:linear-gradient(160deg,var(--t1d,#1b2c52),var(--t1x,#0b1327));color:#fff}
.front .fi::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.16) 46%,transparent 60%);pointer-events:none}
.ft{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 6px;font:700 13px "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.18em;color:var(--t2l,#f6d36b)}
.ft b{font-size:26px;letter-spacing:0;color:#fff}
.fphoto{position:relative;height:198px;margin:0 8px;border-radius:10px;overflow:hidden;border:2px solid var(--t2l,#f6d36b);background:#c9561a}
.fphoto .ball{position:absolute;inset:0;width:100%;height:100%}
.fav{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.fav .av{border:4px solid var(--t2l,#f6d36b);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.fname{margin:10px 10px 0;padding:4px 8px;text-align:center;font:700 29px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent)}
.fsub{text-align:center;font:600 12px Barlow,sans-serif;letter-spacing:.14em;color:var(--t2l,#f6d36b);margin:2px 0 8px}
.fstats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:0 8px;margin-bottom:6px}
.fstats div{background:rgba(255,255,255,.08);border:1px solid var(--t2l,#f6d36b);border-radius:8px;padding:5px 0 4px;text-align:center}
.fstats b{display:block;font:700 24px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.fstats span{font:600 11px Barlow,sans-serif;letter-spacing:.1em;color:var(--t2l,#f6d36b)}
.fstats.s2 b{font-size:20px;color:#ffd9a0}
.ffoot{margin-top:auto;display:flex;justify-content:space-between;padding:6px 12px 8px;font:600 10px Barlow,sans-serif;letter-spacing:.16em;opacity:.8}
.front .ffoot{color:var(--t2l,#f6d36b)}
.back .fi{background:#f6ecd2;color:#2a1b13}
.bt{padding:10px 12px 0;font:700 24px "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.12em;color:var(--t1d,#1b2c52)}
.bn{padding:0 12px 6px;font:600 12px Barlow,sans-serif;color:#7a6a4e}
.bscroll{flex:1;overflow:auto;margin:0 8px;-webkit-overflow-scrolling:touch}
.gr{background:#fffaf0;border:1px solid #d9c79a;border-radius:8px;margin-bottom:6px;padding:6px 8px;color:#2a1b13}
.gr.hl{background:var(--t1d,#1b2c52);border-color:var(--t1d,#1b2c52);color:#fff}
.gr.hl2{background:#f0dfae;border-color:#c9a64e}
.gh{display:flex;justify-content:space-between;align-items:baseline;font:700 13px Barlow,sans-serif;letter-spacing:.04em}
.gh b{font:700 22px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.gr.hl .gh b{color:var(--t2l,#f6d36b)}
.gs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px 2px;margin-top:5px;text-align:center}
.gs i{display:block;font:600 9px Barlow,sans-serif;letter-spacing:.1em;font-style:normal;opacity:.65}
.gs u{text-decoration:none;font:700 16px/1.1 "Barlow Condensed","Arial Narrow",sans-serif}
.bscroll table{font-size:12px;color:#2a1b13}
.bscroll th{position:sticky;top:0;background:#1b2c52;color:#f6d36b;border:0;padding:6px 5px}
.bscroll td{padding:6px 5px;border-bottom:1px solid #eadfc0}
.bscroll th:first-child,.bscroll td:first-child{position:static;background:transparent;text-align:left}
.bscroll th:first-child{background:#1b2c52}
.bscroll tr.t td{border-top:1px solid #b8862b;font-weight:700;background:#f6ecd2}
.back .ffoot{color:#7a6a4e}
.sugbox{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:6px;max-height:240px;overflow:auto}
.sug{display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 12px;text-align:left;font:600 15px Barlow,sans-serif}
.sug span{flex:1}
.sug em{font-style:normal;color:var(--mut);font-size:13px}
.sugn{padding:12px;color:var(--mut);font-size:14px}
.bb{vertical-align:-2px;color:#e8590c}
.bb.f circle{fill:#f58a2d;fill-opacity:1;stroke:#2a1b13}
.bb.f path{stroke:#2a1b13}
.rl>button.favb{padding:4px 6px;line-height:0}
.rl>button.favb .bb{color:var(--mut)}
.rl>button.favb.on .bb{color:#e8590c}
.gear{position:absolute;top:12px;right:12px;z-index:2;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:rgba(0,0,0,.38);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;text-shadow:none}
.thgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.thm{display:flex;align-items:center;gap:8px;text-align:left;border:2px solid transparent;background:var(--card);color:var(--ink);border-radius:12px;padding:8px;font:600 14px/1.15 Barlow,sans-serif}
.thm.on{border-color:var(--acc)}
.sws{display:flex;flex:none;border-radius:50%;overflow:hidden;width:34px;height:34px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.sws i{flex:1}
.rl>button.rn{flex:1;min-width:0;text-align:left;background:transparent;border:0;color:var(--ink);font:inherit;padding:6px 4px}
.modal .card .pl{background:var(--bg);padding:10px}
.modal .card.pc{max-height:88vh;overflow:auto;padding:14px}
.pch{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.pcs{color:var(--mut);font-size:14px;margin-top:2px}
.ph{font:700 12px Barlow,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:12px 2px 6px}
.ptot{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 4px;background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.ptot i{display:block;font:600 10px Barlow,sans-serif;letter-spacing:.1em;color:var(--mut);font-style:normal}
.ptot u{text-decoration:none;font:700 19px/1.1 "Barlow Condensed","Arial Narrow",sans-serif}
.modal .tile{background:var(--bg)}
.glog{background:var(--bg);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.gl1{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.gl1 b{font:700 20px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.gl2{color:var(--mut);font-size:12px;margin-top:3px}
.fbadge{font-style:normal;display:inline-block;background:var(--acc);color:var(--onacc);border-radius:8px;padding:2px 8px;font:700 12px Barlow,sans-serif;letter-spacing:.1em;vertical-align:middle}
.line .fbadge{color:var(--onacc);font-size:12px}
.fld{width:100%;border-radius:10px;border:1px solid var(--line);padding:11px;font:600 15px Barlow,sans-serif;background:var(--card);color:var(--ink);min-width:0}
.mtcard{background:var(--card);border-radius:16px;padding:14px;margin-bottom:14px}
.mth{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mtrec{text-align:center;background:var(--acc);color:var(--onacc);border-radius:12px;padding:6px 14px;flex:none}
.mtrec b{display:block;font:700 28px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.mtrec span{font:600 10px Barlow,sans-serif;letter-spacing:.14em}
.mtgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.mtp{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:6px 8px;font-weight:600;font-size:14px;min-width:0}
.mtp span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtcard .tile{background:var(--bg)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.duo .big{margin-top:0;font-size:21px;padding:14px 14px}
.sec{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden}
.sec>summary{padding:16px;font:700 20px Barlow,sans-serif;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary span{flex:1;min-width:0}
.sec>summary em{font:500 14px Barlow,sans-serif;font-style:normal;color:var(--mut);max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec>summary::after{content:"+";font-size:26px;line-height:1;color:var(--mut);flex:none}
.sec[open]>summary::after{content:"\2212"}
.secb{padding:0 12px 12px}
.secb .hlp{background:var(--bg)}
.secb .thm{background:var(--bg)}
.hlp{background:var(--card);border-radius:12px;margin-bottom:8px;overflow:hidden}
.hlp summary{padding:14px;font:700 17px Barlow,sans-serif;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hlp summary::-webkit-details-marker{display:none}
.hlp summary::after{content:"+";font-size:24px;line-height:1;color:var(--mut);flex:none}
.hlp[open] summary::after{content:"\2212"}
.hb{padding:0 14px 14px;font-size:15px;line-height:1.5}
.hb ol,.hb ul{margin:0;padding-left:20px}
.hb li{margin-bottom:6px}
.authwrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px 4px}
.authcard{width:100%;max-width:380px;background:var(--card);border-radius:18px;padding:24px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.authlogo{font:700 44px/1 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--acc)}
.authsub{color:var(--mut);font-size:14px;line-height:1.45;margin:4px 0 12px}
.authcard h2{margin:6px 0 4px;font:700 24px Barlow,sans-serif}
.authcard input{display:block;width:100%;margin:8px 0;padding:13px;border-radius:10px;border:1px solid var(--line);font:600 16px Barlow,sans-serif;background:var(--bg);color:var(--ink)}
.authcard button.p{display:block;width:100%;margin-top:10px;padding:14px;border-radius:10px;border:0;background:var(--acc);color:var(--onacc);font:700 17px Barlow,sans-serif}
.authcard button.p:disabled{opacity:.55}
.authcard button.lnk{display:block;width:100%;background:none;border:0;color:var(--acc);font:600 15px Barlow,sans-serif;padding:11px 4px;margin-top:2px}

const h2r=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
const r2h=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=h2r(a),B=h2r(b);return r2h(A.map((v,i)=>v*(1-t)+B[i]*t))};

 else if(d.cp){chartP=d.cp;draw();const el=document.getElementById('chartsec');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
 else if(d.st){const now=Date.now(),three=d.st==='f3m'||d.st==='f3x';if(three&&now<ignore3Until)return;
  if(!d.away&&SHOTS.includes(d.st)&&lastTap&&lastTap.t===d.st&&lastTap.p===S.sel&&now-lastTap.at<(three?550:400)&&S.log.includes(lastTap.e)){clearTimeout(assistTimer);if(d.st==='f2m'||d.st==='f3m')pendingAssist=lastTap.e;openCourt(lastTap.e);lastTap=null;return}
  add(d.st,d.away?'away':S.sel);if(!d.away&&SHOTS.includes(d.st))lastTap={t:d.st,p:S.sel,at:now,e:S.log[S.log.length-1]};
  if(!d.away&&(d.st==='f2m'||d.st==='f3m')){const en=S.log[S.log.length-1];clearTimeout(assistTimer);assistTimer=setTimeout(()=>openAssist(en),three?560:410)}}
 else if(b.id==='undo')undo();
 else if(b.id==='undoaway')undoAway();
 else if(d.undost){let i=-1;for(let k=S.log.length-1;k>=0;k--){const e=S.log[k];if(e.t===d.undost&&(!S.sel||e.p===S.sel)){i=k;break}}
  undoOpen=false;if(i<0){toast('Nothing to undo');draw();return}
  const e=S.log.splice(i,1)[0];const p=tm().players.find(x=>x.id===e.p);S.lastMsg='Undid '+(p?p.name+': ':'')+LBL[e.t];save();draw();toast(S.lastMsg)}
 else if(b.id==='undocancel'){undoOpen=false;draw()}
 else if(b.id==='addp'){const n=document.getElementById('pn').value.trim(),m=document.getElementById('pm').value.trim();
  if(!n&&!m)return;{const nm=m||'Player';let pr=S.profiles.find(x=>x.name.trim().toLowerCase()===nm.trim().toLowerCase());
   if(!pr){pr={id:'pr'+Date.now(),name:nm,num:n||'-',pos:'',photo:pendPhoto||'',emoji:'',color:''};S.profiles.push(pr)}
   if(tm().players.some(x=>x.pid===pr.id)){toast(nm+' is already on the roster');return}
   tm().players.push({id:'p'+Date.now(),num:n||'-',name:nm,pos:pr.pos||'',photo:pendPhoto||pr.photo||'',emoji:pr.emoji||'',color:pr.color||'',pid:pr.id})}
  pendPhoto=null;save();draw();const i=document.getElementById('pn');if(i)i.focus()}
 else if(d.rm){tm().players=tm().players.filter(p=>p.id!==d.rm);S.log=S.log.filter(x=>x.p!==d.rm);if(S.sel===d.rm)S.sel=null;S.court=S.court.filter(x=>x!==d.rm);if(!tm().players.length)tm().saved=[];save();draw()}
 else if(b.id==='reset'){if(b.dataset.c){S.log=[];S.q=1;S.gid=null;S.lastMsg='';save();draw()}else{b.dataset.c=1;b.textContent='Tap again to confirm'}}
});
document.addEventListener('change',e=>{if(e.target.id==='file'||e.target.id==='cam'){const f=e.target.files&&e.target.files[0];if(f)shrink(f,u=>{if(photoTarget==='new'){pendPhoto=u;const bt=document.getElementById('pickphoto');if(bt)bt.textContent='Photo added'}else{const p=findP(photoTarget);if(p){p.photo=u;linkSync(p);save();draw();toast('Photo updated')}}});return}
 if(e.target.id==='pcsel'){pcard=e.target.value||null;draw();const el=document.getElementById('pcard');if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});return}
 if(e.target.id==='csp'&&cm){cm.p=e.target.value;renderChartModal();return}
 if(e.target.id==='lg'){S.league=e.target.value;const g=S.games.find(x=>x.id===S.gid);if(g)g.league=S.league;save();draw();return}
 if(e.target.dataset&&e.target.dataset.gl){const g=S.games.find(x=>x.id===e.target.dataset.gl);if(g){g.league=e.target.value;if(S.gid===g.id)S.league=g.league;save();draw()}return}
 if(e.target.id==='opn'){S.opp=e.target.value.trim()||'Away';save();draw()}});
function sugHTML(q){q=(q||'').trim().toLowerCase();const pl=tm().players;
 const base=S.profiles.filter(pr=>!pl.some(p=>p.pid===pr.id||p.name.trim().toLowerCase()===pr.name.trim().toLowerCase())).filter(pr=>!q||pr.name.toLowerCase().includes(q)||String(pr.num).includes(q));
 const l=(q?base.slice().sort((a,b)=>{const sa=a.name.toLowerCase().startsWith(q)?0:1,sb=b.name.toLowerCase().startsWith(q)?0:1;return (sa-sb)||a.name.localeCompare(b.name)}):sortedProfiles(base)).slice(0,40);
 return l.length?l.map(pr=>`<button class="sug" data-sg="${pr.id}">${av(pr,30)}<span>${pr.fav?BB(14,true)+' ':''}<b class="num">#${esc(pr.num)}</b> ${esc(pr.name)}</span><em>${esc(pr.pos||'')}</em></button>`).join(''):`<div class="sugn">${S.profiles.length?'No matching previous players':'No previous players yet'}</div>`}
function showSug(){const box=document.getElementById('psug'),inp=document.getElementById('pm');if(!box||!inp)return;box.innerHTML=sugHTML(inp.value);box.hidden=false;box.scrollIntoView({block:'nearest',behavior:'smooth'})}
document.addEventListener('focusin',e=>{if(e.target.id==='pm')showSug()});
document.addEventListener('input',e=>{if(e.target.id==='pm')showSug()});
if(tm().players.length&&S.tab==='roster')S.tab='game';
if(AUTH_ON){applyTheme();initAuth()}else{if(cleanData())save();applyTheme();draw()}
</script>
</body></html>
